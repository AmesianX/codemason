[package]
name = "codemason"
version = "3.0.0"
edition = "2021"
description = "AI-powered coding assistant CLI (Rust port of codemason)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "deflate", "multipart"] }
futures = "0.3"
async-stream = "0.3"
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
similar = "2"
globset = "0.4"
walkdir = "2"
base64 = "0.22"
# Client-side image preparation before sending to the vision server (utils/image_prep.rs).
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
bytes = "1"
hex = "0.4"
rand = "0.8"
aes-gcm = "0.10"
sha2 = "0.10"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
pulldown-cmark = "0.12"
syntect = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
dirs = "5"
libc = "0.2"
shlex = "1"
url = "2"
percent-encoding = "2"
# Decoding a response that declares a legacy charset (EUC-KR, Shift_JIS, GBK...).
# std has no decoder beyond UTF-8, so without this such a page reached the model
# as replacement characters. Pure Rust, no transitive dependencies.
encoding_rs = "0.8"
html-escape = "0.2"
scraper = "0.20"
once_cell = "1"
parking_lot = "0.12"
anyhow = "1"
thiserror = "1"
signal-hook = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Image decode/resize/encode is unusable unoptimized: one 1080x20000 Lanczos tile
# pass took 300 s in a debug test. Optimize just these crates in dev/test builds.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
